services:
  # 1. DATABASE POSTGRESQL (100% ACID & ZERO-HALLUCINATION LEDGER)
  postgres:
    image: postgres:16-alpine
    container_name: cakue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cakue_db
      POSTGRES_USER: cakue_user
      POSTGRES_PASSWORD: cakue_password_secure2026
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cakue_user -d cakue_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. ADMINER (DATABASE WEB GUI FOR POSTGRESQL)
  adminer:
    image: adminer:latest
    container_name: cakue-adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # 3. CAKUE BACKEND REST API & LEDGER ENGINE
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cakue-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://cakue_user:cakue_password_secure2026@postgres:5432/cakue_db
      - WA_GATEWAY_URL=http://wa-gateway:3333
    depends_on:
      postgres:
        condition: service_healthy

  # 4. CAKUE FRONTEND (VUE 3 + TAILWIND + NGINX SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cakue-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # 5. BAILEYS WHATSAPP GATEWAY (SELF-HOSTED $0 COST)
  wa-gateway:
    build:
      context: ./wa-gateway
      dockerfile: Dockerfile
    container_name: cakue-wa-gateway
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      - wa_auth:/app/auth_info_baileys
    environment:
      - PORT=3333
      - NODE_ENV=production

volumes:
  pgdata:
    name: cakue_postgres_data
  wa_auth:
    name: cakue_baileys_auth
